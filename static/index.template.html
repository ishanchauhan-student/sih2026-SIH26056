<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FareIndex · FastAPI preview</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #07131f; color: #f5f7fa; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 70% 10%, #12334a, transparent 45%), #07131f; }
      main { max-width: 980px; margin: auto; padding: 48px 24px; }
      .eyebrow { color: #45d5bb; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; }
      h1 { font-size: clamp(34px, 7vw, 72px); line-height: .95; margin: 16px 0; max-width: 640px; }
      p { color: #9cb1c2; max-width: 600px; line-height: 1.6; }
      .plane { width: 110px; animation: fly 7s ease-in-out infinite; filter: drop-shadow(0 0 22px #45d5bb); }
      @keyframes fly { 0%,100% { transform: translate(0, 8px) rotate(-4deg); } 50% { transform: translate(150px, -22px) rotate(4deg); } }
      .panel { margin-top: 32px; border: 1px solid #1d3c4d; border-radius: 24px; padding: 20px; background: rgba(11, 32, 47, .8); }
      button { border: 0; border-radius: 999px; background: #f1b44c; color: #07131f; padding: 12px 18px; font-weight: 800; cursor: pointer; }
      canvas { max-height: 360px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">FastAPI · SQLite · Laspeyres</div>
      <h1>Track the cost of crossing India.</h1>
      <img class="plane" alt="Animated plane" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 80'%3E%3Cpath fill='%23f1b44c' d='M8 43h58L103 8h14L99 43h43c10 0 14 8 2 10H98l18 19h-13L75 53H8c-8 0-8-10 0-10Z'/%3E%3C/svg%3E" />
      <p>A working local preview of the FareIndex API. The full responsive dashboard is built separately and uses these same endpoints.</p>
      <button id="scrape">Trigger next-day scrape</button>
      <div class="panel"><canvas id="chart"></canvas></div>
    </main>
    <!-- FAREINDEX_STATIC_SCRIPT -->
  </body>
</html>
